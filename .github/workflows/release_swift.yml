name: Release Swift artifact

# Fires on push to `release/v*` branches. Builds the Apple xcframework on CI,
# bakes its SHA into Package.swift (bot commit, `[skip swift-release]` to
# avoid re-firing), and uploads the zip to a draft GitHub release. release.yml
# promotes the draft to published when the tag is pushed — no rebuild, so the
# SHA in Package.swift always matches the shipped zip.
#
# For the cmux fork's first usable release, main intentionally keeps pointing at the
# last published upstream artifact. The release branch switches repository +
# tag; after this workflow bakes the checksum and uploads the draft, tag and
# publish that exact commit before merging it. See RELEASING.md.

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-bake:
    name: Build xcframework + bake SHA + upload draft
    if: "!contains(github.event.head_commit.message, '[skip swift-release]')"
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: davidB/rust-cargo-make@d8952235ddd22b65d7c6b9194d4dbd58c3ffc48a # v1.14.0
        with:
          version: 0.37.24
      - name: Assert ARM Sonoma runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 14
          sw_vers
      - name: Build xcframework + verify + zip
        run: |
          cargo make swift-xcframework
          cargo make verify-swift-xcframework
          cargo make verify-swift-multi-xcframework-consumer
          cargo make verify-swift-consumer
          bash scripts/release/zip_xcframework.sh
      - name: Attest Swift artifact provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: IrohLib.xcframework.zip
      - name: Bake SHA into Package.swift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          bash scripts/release/swift_bake_sha.sh
      - name: Upload zip to draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/swift_upload_draft.sh
