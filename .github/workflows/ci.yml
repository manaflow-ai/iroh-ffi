name: CI

# Rust core only — per-language CI lives in sibling workflows:
#   ci_python.yml, ci_swift.yml, ci_kotlin.yml, ci_js.yml

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  rust:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    name: Rust - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest, macOS-arm-latest, windows-latest]
        include:
          - name: ubuntu-latest
            runner: ubuntu-latest
          - name: macOS-arm-latest
            runner: macos-14
          - name: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: davidB/rust-cargo-make@184c522bf8152f601a20749ca36c742b57ba568b # v1
      - name: cargo make test-rust
        run: cargo make test-rust

  fmt-clippy-docs:
    timeout-minutes: 30
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: davidB/rust-cargo-make@184c522bf8152f601a20749ca36c742b57ba568b # v1
      - run: cargo make format-check
      - run: cargo make clippy
      - run: cargo make docs
